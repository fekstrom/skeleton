name: Continuous integration

on:
  - push

jobs:
  cmake-formatting:
    runs-on: ubuntu-24.04

    container:
      image: ghcr.io/${{ github.repository_owner }}/skeleton/ci:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    steps:
    - uses: actions/checkout@v7

    - name: Check formatting
      run: |
        ./tools/cmake_formatting.py --diff

  build-and-test-linux:
    runs-on: ubuntu-24.04

    container:
      image: ghcr.io/${{ github.repository_owner }}/skeleton/ci:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    steps:
    - uses: actions/checkout@v7

    # Dependencies and CMAKE_PREFIX_PATH are baked into the CI image.
    - name: Build
      run: |
        cmake --preset dev -D CMAKE_BUILD_TYPE=RelWithDebInfo -D SKELETON_BUILD_DOCUMENTATION=OFF -D SKELETON_ENABLE_INSTALL=OFF
        cmake --build build --config RelWithDebInfo

    - name: Check that install is disabled
      run: |
        cmake --install build --config RelWithDebInfo --prefix install
        python3 -c "import os; assert not os.path.exists('install'), 'install exists even though ENABLE_INSTALL=OFF';"

    - name: Test
      run: |
        ctest --test-dir build --build-config RelWithDebInfo --output-on-failure

    - name: User test
      run: |
        cmake -P tools/user_test.cmake

  build-and-test-windows-macos:
    strategy:
      matrix:
        runner: [windows-2022, macos-14]

    runs-on: ${{ matrix.runner }}

    env:
      DEPENDENCIES_DIR: ${{ github.workspace }}/../dependencies

    steps:
    - uses: actions/checkout@v7

    - name: Install CMake
      uses: lukka/get-cmake@f5b8fbb4d77cec1acc5a5f9f0df4beffaf5d98d9 # v3.4.4
      with:
        cmakeVersion: "4.2.3"

    - name: Cache dependencies
      id: cache-dependencies
      uses: actions/cache@v4
      with:
        path: ${{ env.DEPENDENCIES_DIR }}
        key: dependencies-${{ matrix.runner }}-${{ hashFiles('tools/install_dependencies_from_source.cmake') }}

    - name: Install dependencies
      if: steps.cache-dependencies.outputs.cache-hit != 'true'
      run: |
        cmake -D INSTALL_DIR=${{ env.DEPENDENCIES_DIR }} -P tools/install_dependencies_from_source.cmake
        cmake -E rm -rf ${{ env.DEPENDENCIES_DIR }}/stage

    - name: Build
      run: |
        cmake --preset dev -D CMAKE_BUILD_TYPE=RelWithDebInfo -D SKELETON_BUILD_DOCUMENTATION=OFF -D SKELETON_ENABLE_INSTALL=OFF
        cmake --build build --config RelWithDebInfo
      env:
        CMAKE_PREFIX_PATH: ${{ env.DEPENDENCIES_DIR }}

    - name: Check that install is disabled
      run: |
        cmake --install build --config RelWithDebInfo --prefix install
        python -c "import os; assert not os.path.exists('install'), 'install exists even though ENABLE_INSTALL=OFF';"

    - name: Test
      run: |
        ctest --test-dir build --build-config RelWithDebInfo --output-on-failure

    - name: User test
      run: |
        cmake -P tools/user_test.cmake
      env:
        CMAKE_PREFIX_PATH: ${{ env.DEPENDENCIES_DIR }}

  # SKELETON_GENERATE_PROJECT_SKIP_BEGIN
  generate-project:
    strategy:
      matrix:
        runner: [ubuntu-22.04, windows-2022, macos-14]

    runs-on: ${{ matrix.runner }}

    env:
      DEPENDENCIES_DIR: ${{ github.workspace }}/../dependencies
      MY_PROJECT_DIR: ${{ github.workspace }}/../my_project

    steps:
    - uses: actions/checkout@v7

    - name: Install CMake
      uses: lukka/get-cmake@f5b8fbb4d77cec1acc5a5f9f0df4beffaf5d98d9 # v3.4.4
      with:
        cmakeVersion: "4.2.3"

    - name: Create directories
      run: |
        cmake -E make_directory ${{ env.MY_PROJECT_DIR }}

    - name: Cache dependencies
      id: cache-dependencies
      uses: actions/cache@v4
      with:
        path: ${{ env.DEPENDENCIES_DIR }}
        key: dependencies-${{ matrix.runner }}-${{ hashFiles('tools/install_dependencies_from_source.cmake') }}

    - name: Install dependencies
      if: steps.cache-dependencies.outputs.cache-hit != 'true'
      run: |
        cmake -D INSTALL_DIR=${{ env.DEPENDENCIES_DIR }} -P tools/install_dependencies_from_source.cmake
        cmake -E rm -rf ${{ env.DEPENDENCIES_DIR }}/stage

    - name: Generate MyProject
      run: |
        python tools/generate_project.py MyProject --parent_directory ${{ env.MY_PROJECT_DIR }}

    - name: Build
      working-directory: ${{ env.MY_PROJECT_DIR }}/my_project
      run: |
        cmake --preset dev -D CMAKE_BUILD_TYPE=RelWithDebInfo -D MY_PROJECT_BUILD_DOCUMENTATION=OFF -D MY_PROJECT_ENABLE_INSTALL=OFF
        cmake --build build --config RelWithDebInfo
      env:
        CMAKE_PREFIX_PATH: ${{ env.DEPENDENCIES_DIR }}

    - name: Check that install is disabled
      working-directory: ${{ env.MY_PROJECT_DIR }}/my_project
      run: |
        cmake --install build --config RelWithDebInfo --prefix install
        python -c "import os; assert not os.path.exists('install'), 'install exists even though ENABLE_INSTALL=OFF';"

    - name: Test
      working-directory: ${{ env.MY_PROJECT_DIR }}/my_project
      run: |
        ctest --test-dir build --build-config RelWithDebInfo --output-on-failure

    - name: User test
      working-directory: ${{ env.MY_PROJECT_DIR }}/my_project
      run: |
        cmake -P tools/user_test.cmake
      env:
        CMAKE_PREFIX_PATH: ${{ env.DEPENDENCIES_DIR }}
  # SKELETON_GENERATE_PROJECT_SKIP_END
